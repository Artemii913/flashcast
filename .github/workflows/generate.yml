name: Generate Podcast

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install feedparser requests edge-tts

      - name: Parse news
        run: python scripts/rss_parser.py

      - name: Generate audio files
        run: |
          python -c "
          import asyncio, edge_tts, os

          VOICE = 'ru-RU-DmitryNeural'

          async def synthesize(text, out):
              c = edge_tts.Communicate(text=text, voice=VOICE)
              await c.save(out)

          async def main():
              categories = ['news', 'tech', 'economy', 'politics', 'science', 'culture', 'sport']
              for cat in categories:
                  src = f'data/script_{cat}.txt'
                  if os.path.exists(src):
                      print(f'Generating {cat}...')
                      text = open(src, encoding='utf-8').read()
                      await synthesize(text, f'data/podcast_{cat}.mp3')
                      print(f'Done: data/podcast_{cat}.mp3')
                  else:
                      print(f'Skip {cat}: no script')
              if os.path.exists('data/script.txt'):
                  print('Generating ALL...')
                  text = open('data/script.txt', encoding='utf-8').read()
                  await synthesize(text, 'data/podcast_all.mp3')
                  print('Done: data/podcast_all.mp3')

          asyncio.run(main())
          "
      
      - name: List files
        run: ls -la data/
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "🎙️ Podcasts $(date +'%Y-%m-%d')" || exit 0
          git push
