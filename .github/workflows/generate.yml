name: Generate Podcast

on:
  schedule:
    # Каждый день в 6:00 UTC (9:00 МСК)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt gtts
      
      - name: Generate podcast
        run: |
          cd скрипты
          python rss_parser.py
          cd ..
          python -c "from gtts import gTTS; text=open('данные/script.txt','r',encoding='utf-8').read(); tts=gTTS(text,lang='ru'); tts.save('podcast.mp3'); print('Done!')"
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "🎙️ Новый подкаст $(date +%Y-%m-%d)" || exit 0
          git push
